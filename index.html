<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF9F1C">
<title>Sunshine Rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--a1:#FFD25A;--a2:#FF9F1C;--a3:#E8590C;--ink:#2B1600;--mute:#7A6A55;--tint:#FFF4DC;--line:#F6DFA8;--bg:#FFEFC2}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font:15px/1.45 'Nunito Sans',system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(180deg,#FFE18A,#FFF3D1 260px,#FBFAF6 520px) fixed;padding-bottom:104px}
h1,h2,h3,.disp{font-family:'Baloo 2',system-ui,sans-serif;line-height:1.1}
button,input{font:inherit;color:inherit}
.pg{max-width:480px;margin:0 auto;padding:14px 14px 0;animation:in .3s ease-out}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.c{text-align:center}.mute{color:var(--mute)}.sm{font-size:13px}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.hd h1{font-size:22px;flex:1}
.rb{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.7);font-size:20px;cursor:pointer;flex:none}
.rb.g{background:var(--a2);color:#fff;font-size:18px}
.av{width:46px;height:46px;border-radius:14px;object-fit:cover;background:#fff;flex:none}
.hi{flex:1;line-height:1.15}.hi small{display:block;font-size:14px}.hi b{font:800 20px 'Baloo 2'}
.gift{border:0;background:none;font-size:30px;cursor:pointer;animation:wig 2.6s infinite}
@keyframes wig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-14deg)}92%{transform:rotate(12deg)}}
.pill{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--a2);border-radius:99px;padding:3px 14px 3px 3px;font-weight:800;min-width:92px}
.coin{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6B0,#FFC21A 60%,#E58A00);border:2px solid #FFE98A;font:800 14px 'Baloo 2';color:#7A3F00;flex:none}
.bn{overflow:hidden;border-radius:22px;border:3px solid var(--a2);height:170px;margin-bottom:16px;box-shadow:0 8px 24px rgba(255,150,0,.3)}
.bt{display:flex;height:100%;transition:transform .7s cubic-bezier(.6,0,.2,1)}
.bs{position:relative;overflow:hidden;min-width:100%;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:8px;cursor:pointer;color:#fff;border:0;text-align:left}
.bs.a{background:linear-gradient(135deg,#FFB300,#E8590C)}.bs.b{background:linear-gradient(135deg,#7B2FF7,#F107A3)}
.bs::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.3) 0 8deg,transparent 8deg 20deg);animation:turn 30s linear infinite}
.bs h2{font-size:24px;max-width:72%;position:relative;z-index:1}.bs .jb{background:#fff;color:var(--a3);font-weight:800;border-radius:99px;padding:5px 18px;position:relative;z-index:1}
@keyframes turn{to{transform:rotate(360deg)}}
.sh{position:relative;background:#fff;border-radius:30px;padding:20px 14px 14px;margin-bottom:14px;box-shadow:0 -6px 30px rgba(255,150,0,.14)}
.sh::before{content:"";position:absolute;top:-1px;left:50%;margin-left:-14px;width:28px;height:13px;border-radius:0 0 14px 14px;background:var(--bg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:block;width:100%;border:0;border-radius:99px;padding:13px 18px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer;background:linear-gradient(180deg,#FFC93C,#FF9A00);color:#2B1600;border-bottom:4px solid #D97A00;margin-top:12px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.sm2{display:inline-flex;width:auto;padding:8px 18px;margin:0;gap:6px;align-items:center}
.btn.red{background:linear-gradient(180deg,#F43F3F,#C70000);color:#fff;border-bottom-color:#8E0000}
.btn:disabled{opacity:.5}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,.of:focus-visible{outline:3px solid #2F6BFF;outline-offset:2px}
.ol{max-height:calc(100vh - 440px);min-height:250px;overflow:auto;margin-top:12px;padding-bottom:6px}
.of{display:flex;align-items:stretch;background:var(--tint);border:1.5px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden;cursor:pointer;width:100%;text-align:left;padding:0;transition:transform .15s}
.of:active{transform:scale(.98)}
.nm{flex:1;padding:10px 12px;font-weight:800;display:flex;align-items:center;gap:12px}
.lg{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font:800 20px 'Baloo 2';flex:none;overflow:hidden}
.rw{width:78px;background:#FFE7AE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 18px 'Baloo 2'}
.card{position:relative;background:rgba(255,255,255,.75);border:1.5px solid var(--line);border-radius:26px;padding:16px;margin-bottom:14px}
.card.t{background:linear-gradient(135deg,rgba(255,210,90,.55),rgba(255,255,255,.7))}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.k{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;font-size:12px;color:var(--mute)}.k b{display:block;font:800 22px 'Baloo 2';color:var(--ink)}
.tabs{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;border-radius:14px;padding:11px;font-weight:800;cursor:pointer;transition:all .25s}
.tabs button.on{background:linear-gradient(180deg,#FFC93C,#FF9A00);box-shadow:0 4px 0 #D97A00}
.rib{position:relative;display:flex;align-items:center;gap:10px;background:var(--tint);border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;padding:0 0 0 0}
.rib>em{writing-mode:vertical-rl;transform:rotate(180deg);font-style:normal;font-size:11px;font-weight:800;padding:0 4px;align-self:stretch;display:grid;place-items:center;background:var(--a2);color:#fff}
.rib.pending>em{background:#E0A000}.rib.rejected>em{background:#D6372E}
.rib .nm{padding:10px 0}.rib small{display:block;font-weight:600;color:var(--mute);font-size:12px}
.rib .rw{align-self:stretch;width:74px}
.sk{display:block;height:64px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,#FBEFD0 25%,#FFF8E6 50%,#FBEFD0 75%);background-size:200% 100%;animation:sh 1.1s infinite}
.sk.w{display:inline-block;height:20px;width:30px;margin:0;vertical-align:middle}
@keyframes sh{to{background-position:-200% 0}}
.tk{position:relative;background:#fff;border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(255,150,0,.12)}
.tk::before,.tk::after{content:"";position:absolute;top:var(--n,62px);width:22px;height:22px;border-radius:50%;background:#FFF1CC}
.tk::before{left:-11px}.tk::after{right:-11px}
.tk hr{border:0;border-top:2px dashed var(--line);margin:10px -4px}
.chip{border-radius:10px;padding:2px 12px;font-size:13px;font-weight:800}
.chip.ok{background:#D9F5DF;color:#1E8A3A}.chip.pd{background:#FFF0B3;color:#9A6A00}.chip.lk{background:#EEE;color:#777}.chip.no{background:#FFDADA;color:#C00}
.li{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:14px;color:#4A3A25}
.li::before{content:"";flex:none;width:12px;height:12px;margin-top:5px;border-radius:50%;background:var(--a2);box-shadow:0 0 0 4px rgba(255,159,28,.25)}
.lock{position:absolute;inset:0;border-radius:24px;background:rgba(255,244,220,.9);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;text-align:center;padding:10px}
.lock i{font-style:normal;font-size:42px}
.fx{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:452px;display:flex;gap:10px;z-index:9}
.fx .btn{margin:0;display:flex;justify-content:center;gap:8px}
.medal{width:150px;height:150px;border-radius:50%;margin:10px auto 14px;display:grid;place-items:center;font-size:76px;color:#FFE27A;text-shadow:0 4px 0 #C26A00;background:radial-gradient(circle at 35% 30%,#FFC93C,#E8590C);box-shadow:0 0 0 10px rgba(255,255,255,.55),0 0 50px rgba(255,159,28,.6);animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.05)}}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 4px;margin-top:12px}
.st{text-align:center;font-size:11px;font-weight:700;color:#A8946F}
.st i{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 2px;border-radius:50%;background:#EDE3CC;font-style:normal;font-size:20px;color:#fff}
.st.on i{background:radial-gradient(circle at 35% 30%,#FFC93C,#E8590C);color:#FFE27A}.st.on{color:var(--ink)}
.code{display:flex;justify-content:space-between;align-items:center;border:2.5px dotted var(--a2);border-radius:18px;padding:8px 8px 8px 16px;font:800 20px 'Baloo 2';color:var(--a3);margin:14px 0 4px}
.tl{margin-top:8px}.tl .li{margin:12px 0}
.wa{display:flex;gap:10px;margin-top:14px}.wa .btn{margin:0;background:linear-gradient(180deg,#34D96B,#12A94A);color:#fff;border-bottom-color:#0C7D35;display:flex;justify-content:center;align-items:center;gap:8px}
.wa .sq{width:56px;flex:none;padding:0}
.bal{font:800 54px 'Baloo 2';color:var(--a3)}
.ws{position:relative;overflow:hidden}.ws::after{content:"₹";position:absolute;right:-10px;top:-10px;font:800 150px 'Baloo 2';color:rgba(232,89,12,.12)}
.big{position:relative;border-radius:24px;padding:18px;margin-bottom:12px;color:#fff;overflow:hidden;background:linear-gradient(135deg,#FF9A00,#E8590C)}
.big h2{font-size:26px}.big p{font-size:14px;margin-bottom:10px;max-width:60%}
.big::after{content:"₹";position:absolute;right:10px;bottom:-30px;font:800 130px 'Baloo 2';color:rgba(255,255,255,.3)}
.big .btn{display:inline-block;width:auto;padding:8px 26px;margin:0;background:#fff;border-bottom-color:#E5C7A0}
label{display:block;font-weight:800;margin:14px 0 6px;font-size:14px}
input{width:100%;border:2px dashed var(--a2);border-radius:14px;padding:12px;background:var(--tint)}
.set{display:flex;align-items:center;gap:12px;width:100%;border:0;background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;font-weight:800;text-align:left;cursor:pointer;box-shadow:0 2px 10px rgba(255,150,0,.1)}
.set span.ic{width:36px;height:36px;border-radius:50%;background:var(--tint);display:grid;place-items:center}
.set b{flex:1}.set em{font-style:normal;font-size:20px}
.fq{width:100%;text-align:left;border:0;background:var(--tint);border-radius:16px;padding:14px;margin-bottom:10px;font-weight:800;display:flex;justify-content:space-between;cursor:pointer}
.fa{background:#fff;border:1.5px solid var(--line);border-radius:6px 16px 16px 16px;padding:12px;margin:-2px 0 10px 8px;color:#4A3A25;animation:in .25s}
#sheet{position:fixed;inset:0;background:rgba(30,15,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.open{display:flex}#sheet.ct{align-items:center;padding:20px}
.panel{background:#fff;width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.ct .panel{border-radius:26px;padding:0;overflow:hidden;max-width:340px}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.md{text-align:center;padding:0 20px 22px}.md .ic{width:76px;height:76px;margin:24px auto 12px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:800;color:#fff;animation:pop .4s}
.md.bad{background:linear-gradient(#FBD0D6 110px,#fff 110px)}.md.bad .ic{background:#E00000}
.md.ok{background:linear-gradient(#FFE9A8 110px,#fff 110px)}.md.ok .ic{background:var(--a2)}
@keyframes pop{from{transform:scale(.3)}60%{transform:scale(1.15)}}
.md h2{font-size:34px}.md p{margin:8px 0 6px}
.wd{position:relative;overflow:hidden;border-radius:22px;padding:16px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#FF9A00,#E8590C)}
.wd h3{font-size:24px}.wd p{font-size:13px}.wd .btn{display:inline-block;width:auto;padding:7px 22px;margin-top:10px;background:#fff;color:var(--a3);border-bottom-color:#E5C7A0}
.wd::after{content:"₹";position:absolute;right:14px;top:6px;font:800 90px 'Baloo 2';color:rgba(255,255,255,.35)}
.panel ol{padding-left:20px}
.wheelbox{position:relative;width:250px;height:250px;margin:18px auto 6px}
.wheel{position:relative;width:100%;height:100%;border-radius:50%;border:6px solid #FFE35C;box-shadow:0 0 30px rgba(255,159,28,.5);background:conic-gradient(#FF4D6D 0 45deg,#FF9A00 45deg 90deg,#FFD23F 90deg 135deg,#3DDC97 135deg 180deg,#FF4D6D 180deg 225deg,#B23AFF 225deg 270deg,#FF9A00 270deg 315deg,#38B6FF 315deg 360deg);transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.wheel span{position:absolute;left:50%;top:50%;width:30px;margin-left:-15px;text-align:center;font:800 22px 'Baloo 2';color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.hub{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#fff;border:4px solid #FFE35C;z-index:2}
.pin{position:absolute;left:50%;top:-12px;margin-left:-14px;width:0;height:0;border:14px solid transparent;border-top:26px solid #2B1600;z-index:3}
nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;height:68px;border-radius:34px;display:flex;align-items:center;padding:0 8px;background:linear-gradient(135deg,#FF9F1C,#E8590C);box-shadow:0 10px 30px rgba(232,89,12,.45);z-index:10}
nav button{flex:1;height:52px;border:0;border-radius:26px;background:none;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;cursor:pointer;transition:flex .3s,background .3s}
nav button.on{flex:2.3;background:rgba(255,255,255,.3)}
nav button span{display:none}nav button.on span{display:inline;animation:in .3s}
nav svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#2B1600;color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
#splash,#login{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;padding:24px;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.28) 0 70px,transparent 71px),radial-gradient(circle at 95% 85%,rgba(255,255,255,.25) 0 90px,transparent 91px),linear-gradient(160deg,#FFB300,#E8590C);transition:opacity .5s}
#login{z-index:40}
.logo{width:130px;height:130px;animation:turn 14s linear infinite;filter:drop-shadow(0 0 20px rgba(255,255,255,.6))}
.spn{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.4);border-top-color:#fff;animation:turn .8s linear infinite}
#login h1{font-size:38px}#login .btn{max-width:340px;background:#fff;color:var(--a3);border-bottom-color:#E5C7A0}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

#splash,#login{background:radial-gradient(circle at 50% 38%,#FFE9A0 0,#FFF8E1 38%,#fff 72%);color:var(--ink)}
.slogo{position:relative;width:min(78vw,340px);animation:logoIn 1.2s cubic-bezier(.2,1.4,.4,1) both,flt 3s 1.2s ease-in-out infinite;filter:drop-shadow(0 12px 24px rgba(255,140,0,.35))}
.slogo.st{animation:flt 3s ease-in-out infinite}
@keyframes logoIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes flt{50%{transform:translateY(-8px) scale(1.02)}}
.glow{position:absolute;top:36%;width:240px;height:240px;margin-top:-120px;border-radius:50%;border:3px solid rgba(255,159,28,.55);animation:ring 2.4s ease-out infinite}
.glow.b{animation-delay:1.2s}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(2.4);opacity:0}}
.spn{border:4px solid #FFE3A0;border-top-color:#FF9A00}
#login .btn{background:linear-gradient(180deg,#FFC93C,#FF9A00);color:#2B1600;border-bottom-color:#D97A00}
.bs.c{background:linear-gradient(135deg,#25D366,#0E8F4A)}
#tour{position:fixed;inset:0;z-index:45;background:linear-gradient(180deg,#FFF0B8,#fff 55%);display:flex;flex-direction:column;align-items:center;padding:16px 18px calc(18px + env(safe-area-inset-bottom));overflow:auto}
.skip{align-self:flex-end;border:0;background:rgba(0,0,0,.07);border-radius:99px;padding:8px 20px;font-weight:800;cursor:pointer}
.tm{width:min(86vw,360px);margin:6px auto 0;animation:in .4s}.tm img{width:100%;display:block;animation:flt 3.2s ease-in-out infinite}
.tbub{position:relative;background:#FFD23F;border-radius:26px;padding:14px 20px;font:800 21px/1.2 'Baloo 2';text-align:center;margin:8px 0 18px;max-width:380px;animation:pop2 .45s}
.tbub::after{content:"";position:absolute;top:-12px;left:28%;border:12px solid transparent;border-top:0;border-bottom-color:#FFD23F}
@keyframes pop2{from{transform:scale(.7);opacity:0}}
.ts{display:flex;gap:12px;align-items:center;background:#fff;border-radius:24px;padding:14px;width:100%;max-width:380px;box-shadow:0 8px 24px rgba(255,150,0,.2);animation:in .35s}
.tn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 22px 'Baloo 2';flex:none}
.td{display:flex;gap:6px;margin:16px 0 4px}.td i{width:9px;height:9px;border-radius:50%;background:#EAD9A8;transition:all .3s}.td i.on{width:26px;border-radius:9px;background:var(--a2)}

#splash,#login{background:#fff}
.slogo{mix-blend-mode:multiply;filter:none}
.glow{display:none}
.tm img{mix-blend-mode:multiply}
.pill{cursor:pointer;font:inherit;color:inherit}
.wc{position:relative;overflow:hidden;border-radius:28px;padding:22px;margin-bottom:16px;color:#fff;background:linear-gradient(140deg,#FFB300 0,#FF8A00 45%,#E8590C 100%);box-shadow:0 16px 36px rgba(232,89,12,.4)}
.wc::before{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.22) 0 8deg,transparent 8deg 20deg);animation:turn 40s linear infinite}
.wc>*{position:relative}
.wl{font-weight:800;font-size:13px;letter-spacing:.6px;text-transform:uppercase;opacity:.95}
.wb{display:flex;align-items:center;gap:10px;font:800 52px 'Baloo 2';margin-top:4px}
.wb .coin{width:46px;height:46px;font-size:20px}
.wn{font-size:13px;opacity:.95}
.wc .btn.wbtn{background:#fff;color:var(--a3);border-bottom-color:#E5C7A0;margin-top:16px}
.wst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.wst div{background:rgba(255,255,255,.22);border-radius:14px;padding:10px 6px;text-align:center}
.wst b{display:block;font:800 18px 'Baloo 2'}.wst span{font-size:11px}
.yn{display:flex;gap:10px;margin-top:8px}.yn .btn{margin:0}
.fx{align-items:center}
.fx .btn{flex:1;white-space:nowrap;min-height:52px;padding:12px 10px;align-items:center}
.btn.sec{background:#fff;color:var(--a3);border:2px solid var(--a2);border-bottom-width:4px;box-shadow:none}
.adw{position:relative;margin:14px 0;border-radius:18px;overflow:hidden;background:#fff;border:1.5px solid var(--line)}
.adw iframe{width:100%;height:130px;border:0;display:block}
.adl{position:absolute;top:6px;right:8px;font:700 10px system-ui;background:#FFE7AE;color:#7A4A00;border-radius:6px;padding:1px 6px;z-index:2}
.bell{position:relative;border:0;background:rgba(255,255,255,.75);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.bell i{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#E00000;color:#fff;font:700 11px/18px system-ui;font-style:normal;text-align:center;padding:0 4px}
.md.bad{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #F7ECCB}
.hic{width:42px;height:42px;border-radius:12px;background:var(--tint);display:grid;place-items:center;font-size:20px;flex:none}
.hrow>div{flex:1}.hp{color:#1E8A3A;font:800 18px 'Baloo 2'}
#splash,#login{background:linear-gradient(180deg,#FFE18A 0,#FFF3CF 42%,#fff 100%);overflow:hidden}
.rays{position:absolute;left:50%;top:38%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,170,0,.18) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 66%);mask:radial-gradient(circle,#000 0,transparent 66%);animation:turn 60s linear infinite;pointer-events:none}
.tag{font:800 21px 'Baloo 2';color:#B45500;margin-top:-6px;animation:in .8s .8s both;position:relative}
.pbar{position:relative;width:210px;height:8px;border-radius:99px;background:rgba(232,89,12,.16);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFC93C,#E8590C);animation:fill 2.8s ease-out forwards}
@keyframes fill{from{width:0}to{width:100%}}
#splash small{color:#7A6A55;position:relative}
#login p{color:#7A6A55;position:relative;font-weight:700}
#login .slogo,#login .btn{position:relative}
/* ---- Sunshine Lifafa ---- */
#lf{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#fff;text-align:center;padding:20px;background:radial-gradient(circle at 50% 36%,#FFB82E,#E8590C 60%,#7A2400)}
#lf.on{display:flex;animation:in .4s ease-out}#lf.over{background:radial-gradient(circle at 50% 36%,#9A9DB5,#4F5370 62%,#23263B)}
#lf .ray{position:absolute;left:50%;top:36%;width:950px;height:950px;margin:-475px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.16) 0 7deg,transparent 7deg 18deg);animation:turn 40s linear infinite;pointer-events:none}
#lf.over .ray{opacity:.25}#lf>*{position:relative}#lf .ray{position:absolute}
#lf h1{font-size:40px;text-shadow:0 3px 0 rgba(120,40,0,.35)}#lf p{margin:6px 0 4px;font-weight:700;opacity:.95}#lf small{margin-top:12px;font-weight:800;opacity:.85}
.lfb{max-width:290px;background:#fff!important;color:var(--a3)!important;border-bottom-color:#E5C7A0!important;margin-top:22px!important;animation:lfg 1.8s infinite}
@keyframes lfg{50%{box-shadow:0 0 0 10px rgba(255,255,255,.25)}}
.lfsun{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6B0,#FFC21A 60%,#FF7A00);box-shadow:0 0 0 14px rgba(255,233,168,.3),0 0 70px 20px rgba(255,200,60,.7);animation:lfr 1.1s ease-out}
@keyframes lfr{from{transform:translateY(170px) scale(.5);opacity:.2}}
.lfsad{font-size:96px;animation:lfb 3s ease-in-out infinite}
.lfe{position:relative;width:240px;height:160px;margin:34px 0 8px;animation:lfb 2.4s ease-in-out infinite}
@keyframes lfb{50%{transform:translateY(-10px) rotate(-1.5deg)}}
.lfe div{position:absolute}.lfe .bk{inset:0;border-radius:14px;background:linear-gradient(160deg,#C2281D,#8F1308);box-shadow:0 18px 40px rgba(60,10,0,.45)}
.lfe .tk{left:16px;right:16px;top:14px;bottom:14px;border-radius:10px;background:linear-gradient(#FFF6D0,#FFD86B);color:#7A3F00;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;z-index:1;transition:transform .9s cubic-bezier(.2,.9,.3,1.25)}
.lfe .tk small{margin:0;font-size:11px;opacity:.8}.lfe .tk b{font:800 38px 'Baloo 2';line-height:1.1}
.lfe .fr{inset:0;z-index:2;border-radius:0 0 14px 14px;background:linear-gradient(160deg,#E23A25,#B01C10);clip-path:polygon(0 36%,50% 72%,100% 36%,100% 100%,0 100%)}
.lfe .fl{left:0;right:0;top:0;height:60%;z-index:3;border-radius:14px 14px 0 0;background:linear-gradient(#F0502F,#C42815);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s ease}
.lfe .sl{left:50%;top:50%;width:54px;height:54px;margin:-22px 0 0 -27px;z-index:4;border-radius:50%;display:grid;place-items:center;font-size:26px;background:radial-gradient(circle at 35% 30%,#FFF6B0,#FFC21A 60%,#E58A00);border:3px solid #FFE98A;box-shadow:0 0 0 6px rgba(255,214,90,.35);animation:lfp 1.6s infinite}
@keyframes lfp{50%{transform:scale(1.12)}}
.lfe.open{animation:none}.lfe.open .fl{transform:rotateX(180deg);z-index:0}.lfe.open .tk{transform:translateY(-84px) scale(1.1)}
.lfe.open .sl{animation:none;transition:.5s;transform:scale(3);opacity:0}
.lfc{position:absolute!important;top:0;z-index:5}
</style>
</head>

  else{rec.upi=rec.acc=$("#ac").value.trim();rec.ifsc=$("#if").value.trim().toUpperCase();if(!/^\d{9,18}$/.test(rec.acc))return toast("Enter a valid account number.");if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(rec.ifsc))return toast("Enter a valid IFSC code.")}
  if(!(am>=5&&am<=500))return toast("Amount must be between 5 and 500.");

}

/* ---- Sunshine Lifafa ---- */
const LF_CODE=new URLSearchParams(location.search).get("lifafa");let LF_LINK=LF_CODE!==null;let LF=null;
const lfBox=()=>{let b=$("#lf");if(!b){b=document.createElement("div");b.id="lf";document.body.appendChild(b)}return b};
function lfClose(){try{history.replaceState(null,"",location.pathname)}catch(e){}LF_LINK=false;const b=$("#lf");if(b){b.className="";b.innerHTML=""}if(U)draw()}
async function lifafaCheck(){
  if(!U)return;
  try{
    const d=await DB.collection("lifafa").doc("main").get();
    if(!d.exists||d.data().on===false)return lfView("over");
    LF=d.data();if(LF_CODE!==LF.lid)return lfView("over");
    const mine=(await DB.collection("lifafaClaims").doc(LF.lid+"_"+U.id).get()).exists;
    if(mine){if(LF_LINK)lfView("done");return}
    if((LF.n||0)>=LF.max){if(LF_LINK)lfView("over");return}
    lfView("ready");
  }catch(e){}
}
function lfView(v){
  const b=lfBox(),ray='<div class="ray"></div>';
  if(v!=="ready"){
    b.className="on over";sfx("error");
    b.innerHTML=ray+`<div class="lfsad">🌥️</div><h1>${v==="done"?"Already opened":"Lifafa is over"}</h1><p>${v==="done"?"You have already claimed this Lifafa.":"The sun has set on this one. Watch our channel for the next Lifafa!"}</p><button class="btn lfb" onclick="lfClose()">Go Back</button>`;return;
  }
  b.className="on";b.innerHTML=ray+'<div class="lfsun"></div><p>Sunrise… your Lifafa is on its way</p>';
  setTimeout(()=>{if(!$("#lf.on"))return;sfx("ding");
    b.innerHTML=ray+`<h1>Sunshine Lifafa</h1><p>A surprise is waiting inside ✨</p><div class="lfe" id="lfe"><div class="bk"></div><div class="tk"><small>YOU RECEIVED</small><b id="lfa">₹?</b></div><div class="fr"></div><div class="fl"></div><div class="sl">☀️</div></div><button class="btn lfb" id="lfc" onclick="lfClaim()">Claim Now</button><small>Only for the first ${LF.max} users</small>`},1100);
}
async function lfClaim(){
  const bt=$("#lfc");bt.disabled=true;bt.textContent="Opening…";
  const mref=DB.collection("lifafa").doc("main"),uref=DB.collection("users").doc(U.id);let amt=0,lid="";
  try{
    await DB.runTransaction(async tx=>{
      const m=(await tx.get(mref)).data();lid=m.lid;amt=m.amt;
      const cref=DB.collection("lifafaClaims").doc(lid+"_"+U.id);
      if((await tx.get(cref)).exists)throw "done";
      if(m.on===false||(m.n||0)>=m.max)throw "over";
      const u=(await tx.get(uref)).data();
      tx.set(cref,{uid:U.id,lid,amt,t:Date.now()});
      tx.update(mref,{n:(m.n||0)+1});
      tx.update(uref,{uc:(u.uc||0)+amt,earned:(u.earned||0)+amt,hist:[...(u.hist||[]),{t:Date.now(),k:"bonus",amt,n:"Sunshine Lifafa"}].slice(-100),lf:lid});
    });
  }catch(e){
    if(e==="done"||e==="over")return lfView(e);
    bt.disabled=false;bt.textContent="Claim Now";return toast("Could not open. Please try again.");
  }
  U.uc=(U.uc||0)+amt;U.earned=(U.earned||0)+amt;U.lf=lid;addHist("bonus",amt,"Sunshine Lifafa");
  $("#lfe").classList.add("open");sfx("claim");setTimeout(boom,500);
  const a=$("#lfa"),b=$("#lf");let k=0;const iv=setInterval(()=>{k=Math.min(amt,k+amt/18);a.textContent="₹"+fmt(k);if(k>=amt)clearInterval(iv)},45);
  for(let i=0;i<16;i++){const c=document.createElement("span");c.className="coin lfc";c.textContent="₹";c.style.left=Math.random()*92+"%";b.appendChild(c);
    c.animate([{transform:"translateY(-40px) rotate(0)"},{transform:`translateY(${innerHeight+60}px) rotate(${360+Math.random()*360}deg)`}],{duration:1500+Math.random()*1500,delay:600+Math.random()*700,easing:"ease-in",fill:"backwards"}).onfinish=()=>c.remove()}
  bt.disabled=false;bt.textContent="Awesome!";bt.onclick=lfClose;
  const s=b.querySelector("small:last-child");if(s)s.textContent="Added to your wallet 🎉";
}
